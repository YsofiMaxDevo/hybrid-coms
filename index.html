<html lang="ar">

<meta charset="utf-8">

<title>Hybrid Dev</title>
<style>
*{
	scroll-behavior:smooth;
}
body{
	background:#664;
	color:white;
}
header{
	position:fixed;
	z-index:1000;
	margin-left:450;
	top:5;
}
nav{
	width:350;
	height:60;
	border-radius:50px;
	padding:15;
	background:#eec;
}
nav a {
	color:#660;
	margin:15;
	font-size:25;
	text-decoration:none;
	transition-duration:0.2s;
}
nav a:hover {
	color:#990;
	margin:10;
	font-size:30;

}
#hero{
	margin-right:200;

}
#hero a button{
	background:#eec;
	border-radius:50px;
	padding:10px;
	width:200;
	transition-duration:0.3s;
	cursor:pointer;
}
#hero a button:hover{
	background:#ba8;
}
#hero img{
	margin-left:300;
}
#games{
	background:#886;
	color:black;
	width:700;
	height:250;
	overflow:auto;
}
.gems{
	background:white;
	box-shadow:5px 5px 10px black;
	display:flex;
	padding:35;
	margin:20;
	width:550;
	height:50;
	border-radius:50px;
}
.gems h1{
	margin-left:20;display:block;
}
.gems p{
	margin-left:20;display:block;
}
.gems button{
	margin-left:100;
	width:115;
	border-radius:100px;
	border:none;
	background:#442;
	color:white;
	cursor:pointer;
	transition-duration:0.3s;
}
.gems button:hover{
	background:#220;
	size:1.3;
}
#cont a img{
	margin:30;
	opacity:0.6;
	transition-duration:0.3s;
}
#cont a img:hover {
	opacity:1;
}
footer{
	background:black;
	color:orange;
}
@media(max-width:1024px){
	header{
		margin-left:0;
	}
	nav{
		width:300;
	}
	#hero{
		margin-right:0;
	}
	#hero img{
		margin-left:0;
	}
	#games{
		width:300;
	}
	.gems{
		display:inline-block;
		width:190;
		height:150;
	}
	.gems button{
		margin-left:0;
	}
	#cont a img{
		width:50;
		height:50;
	}
}
</style>
</head>
